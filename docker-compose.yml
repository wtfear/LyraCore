name: lyra-core

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyra-core-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-lyra_user}:${DB_PASSWORD:-lyra_secure_password}@postgres:5432/${DB_NAME:-lyra_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-lyra_super_secret_jwt_key_32_characters_minimum_here}
      - PROJECT_NAME=LyraCore Multi-Tenant AI Engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lyra-net

  frontend:
    image: node:20-alpine
    container_name: lyra-core-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run build && npm run start || npm run dev"
    depends_on:
      - backend
    networks:
      - lyra-net

  postgres:
    image: postgres:16-alpine
    container_name: lyra-core-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-lyra_db}
      POSTGRES_USER: ${DB_USER:-lyra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lyra_secure_password}
    volumes:
      - lyra_pg_data:/var/lib/postgresql/data
    networks:
      - lyra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lyra_user} -d ${DB_NAME:-lyra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: lyra-core-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - lyra_redis_data:/data
    networks:
      - lyra-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lyra-net:
    driver: bridge

volumes:
  lyra_pg_data:
  lyra_redis_data:
