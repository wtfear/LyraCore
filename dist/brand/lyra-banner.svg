<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLyra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080312" />
      <stop offset="50%" stop-color="#140626" />
      <stop offset="100%" stop-color="#05010B" />
    </linearGradient>
    <linearGradient id="purpleCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="lyraSuperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgLyra)" />

  <!-- Constellation lines -->
  <g opacity="0.18" stroke="#C084FC" stroke-width="1.5">
    <circle cx="280" cy="200" r="5" fill="#38BDF8" />
    <circle cx="440" cy="260" r="6" fill="#FFFFFF" />
    <circle cx="600" cy="210" r="7" fill="#C084FC" />
    <circle cx="760" cy="260" r="6" fill="#FFFFFF" />
    <circle cx="920" cy="200" r="5" fill="#38BDF8" />
    <line x1="280" y1="200" x2="440" y2="260" />
    <line x1="440" y1="260" x2="600" y2="210" />
    <line x1="600" y1="210" x2="760" y2="260" />
    <line x1="760" y1="260" x2="920" y2="200" />
  </g>

  <!-- Big Hero Star Aura -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="105" fill="url(#purpleCoreGrad)" opacity="0.35" filter="url(#lyraSuperGlow)" />
    <!-- 8-Point Geometric Ray -->
    <polygon points="0,-105 24,-28 105,-20 32,24 68,96 0,38 -68,96 -32,24 -105,-20 -24,-28" fill="url(#purpleCoreGrad)" />
    <!-- Inner Cyan Star -->
    <polygon points="0,-72 14,-20 72,0 14,20 0,72 -14,20 -72,0 -14,-20" fill="url(#cyanGrad)" opacity="0.95" />
    <!-- Core -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#9333EA" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    LYRA<tspan fill="#C084FC">CORE</tspan>
  </text>
  
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#38BDF8">
    SOVEREIGN MULTI-TENANT AI SAAS FOUNDATION
  </text>

  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="2" fill="#E9D5FF">
    Next.js 15 • FastAPI 0.115+ • PostgreSQL 16 • Redis Workers • Stripe &amp; Razorpay • Agent Runtimes
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 535)">
    <g transform="translate(-330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1F1535" stroke="#37245B" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3E8FF">100% Original Build</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1F1535" stroke="#C084FC" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#C084FC">Multi-Tenant RBAC</text>
    </g>
    <g transform="translate(110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1F1535" stroke="#38BDF8" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">FastAPI + Async</text>
    </g>
    <g transform="translate(330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1F1535" stroke="#37245B" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3E8FF">Agent Cockpit</text>
    </g>
  </g>
</svg>
