<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="lyraCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="whiteText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <filter id="harpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0A0612" rx="16" />

  <!-- Harmonic Lyra Grid -->
  <g opacity="0.15" stroke="#C084FC" stroke-width="1.2">
    <line x1="40" y1="20" x2="760" y2="20" />
    <line x1="40" y1="110" x2="760" y2="110" />
    <line x1="40" y1="200" x2="760" y2="200" />
    <circle cx="110" cy="110" r="85" stroke-dasharray="3 5" fill="none" />
  </g>

  <!-- Lyra Celestial Harp Icon -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="54" fill="url(#lyraCoreGrad)" opacity="0.3" filter="url(#harpGlow)" />
    
    <!-- Outer Harp Resonator -->
    <polygon points="0,-64 20,-20 64,0 20,20 0,64 -20,20 -64,0 -20,-20" fill="url(#lyraCoreGrad)" />
    <!-- Inner Harmonic Rhombus -->
    <polygon points="0,-40 12,-12 40,0 12,12 0,40 -12,12 -40,0 -12,-12" fill="url(#cyanSpark)" opacity="0.95" />
    
    <!-- Core Singularity -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#9333EA" />
  </g>

  <!-- Typography -->
  <text x="220" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="url(#whiteText)">
    LYRA<tspan fill="#C084FC">CORE</tspan>
  </text>
  
  <text x="222" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#38BDF8">
    SOVEREIGN MULTI-TENANT AI SAAS FOUNDATION
  </text>

  <text x="222" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#A855F7">
    NEXT.JS 15 • FASTAPI • POSTGRESQL • REDIS WORKERS • AGENT RUNTIME
  </text>

  <!-- MIT Badge -->
  <g transform="translate(680, 42)">
    <rect x="-40" y="-14" width="80" height="26" rx="13" fill="#1F1535" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="-24" cy="-1" r="4" fill="#10B981" />
    <text x="-12" y="3" font-family="sans-serif" font-size="10" font-weight="700" fill="#F3E8FF" letter-spacing="1">MIT</text>
  </g>
</svg>
