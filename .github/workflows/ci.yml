name: LyraCore CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Architecture & Integrity Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Python Backend Manifest & Syntax
        run: |
          echo "Validating Python backend syntax..."
          python -m compileall backend/app

      - name: Validate Frontend Package Manifest
        run: |
          echo "Validating frontend package.json..."
          node -e "const pkg = JSON.parse(require('fs').readFileSync('frontend/package.json', 'utf8')); console.log('Loaded frontend package:', pkg.name);"

      - name: Validate Docker Compose Configuration
        run: |
          echo "Testing docker-compose.yml syntax..."
          docker compose config

      - name: Verify Environment Templates & File Structure
        run: |
          echo "Verifying essential directories and configuration..."
          test -f .env.example || { echo "Missing .env.example"; exit 1; }
          test -f docker-compose.yml || { echo "Missing docker-compose.yml"; exit 1; }
          test -d backend/app || { echo "Missing backend/app"; exit 1; }
          test -d frontend/src || { echo "Missing frontend/src"; exit 1; }

      - name: Verify Brand Assets & Celestial Vectors
        run: |
          echo "Checking brand assets..."
          test -f public/brand/lyra-logo.svg || { echo "Missing lyra-logo.svg"; exit 1; }
          test -f public/brand/lyra-banner.svg || { echo "Missing lyra-banner.svg"; exit 1; }
          grep -q "LYRA" public/brand/lyra-logo.svg || { echo "Invalid logo content"; exit 1; }
          echo "All brand vectors validated."
